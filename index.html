<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPEG — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-base:    #0a0c14;
            --bg-card:    #12151f;
            --bg-input:   #1a1e2e;
            --accent:     #7c6bff;
            --accent-2:   #00d4aa;
            --danger:     #ff4757;
            --text-main:  #e8eaf6;
            --text-muted: #6b7280;
            --border:     rgba(124,107,255,0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-base);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated Background ── */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(124,107,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124,107,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow {
            position: fixed; z-index: 0;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }
        .bg-glow-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #7c6bff 0%, transparent 70%);
            top: -150px; left: -150px;
        }
        .bg-glow-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #00d4aa 0%, transparent 70%);
            bottom: -100px; right: -100px;
            animation-delay: -4s;
        }

        @keyframes floatGlow {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 20px) scale(1.1); }
        }

        /* ── Wrapper ── */
        .login-wrapper {
            position: relative; z-index: 1;
            width: 100%; max-width: 460px;
            padding: 1.5rem;
            animation: fadeUp 0.6s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Card ── */
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem 2.5rem 2rem;
            box-shadow:
                0 0 0 1px rgba(124,107,255,0.05),
                0 25px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        /* ── Logo / Brand ── */
        .brand-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: #fff;
            margin-bottom: 1.25rem;
            box-shadow: 0 8px 24px rgba(124,107,255,0.4);
        }

        .brand-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }

        .brand-title span {
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        /* ── Form ── */
        .form-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .form-control {
            background: var(--bg-input) !important;
            border: 1px solid rgba(255,255,255,0.07) !important;
            border-radius: 10px !important;
            color: var(--text-main) !important;
            padding: 0.75rem 1rem !important;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(124,107,255,0.15) !important;
            outline: none !important;
        }

        .form-control::placeholder { color: #3d4155 !important; }

        .input-group-text {
            background: var(--bg-input) !important;
            border: 1px solid rgba(255,255,255,0.07) !important;
            border-right: none !important;
            color: var(--text-muted) !important;
            border-radius: 10px 0 0 10px !important;
        }

        .input-group .form-control {
            border-left: none !important;
            border-radius: 0 10px 10px 0 !important;
        }

        .input-group:focus-within .input-group-text {
            border-color: var(--accent) !important;
        }

        /* ── Toggle Password ── */
        .btn-toggle-pw {
            background: var(--bg-input) !important;
            border: 1px solid rgba(255,255,255,0.07) !important;
            border-left: none !important;
            color: var(--text-muted) !important;
            border-radius: 0 10px 10px 0 !important;
            padding: 0 0.85rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn-toggle-pw:hover { color: var(--accent) !important; }

        /* ── Submit Button ── */
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent), #9c8bff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
            box-shadow: 0 6px 20px rgba(124,107,255,0.35);
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(124,107,255,0.5);
        }

        .btn-login:active { transform: translateY(0); }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Spinner ── */
        .btn-login .spinner {
            display: none;
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
        }

        .btn-login.loading .spinner { display: inline-block; }
        .btn-login.loading .btn-text { opacity: 0.7; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Alert ── */
        .alert-custom {
            border-radius: 10px;
            border: none;
            padding: 0.85rem 1rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: fadeUp 0.3s ease both;
        }

        .alert-danger-custom {
            background: rgba(255,71,87,0.12);
            border: 1px solid rgba(255,71,87,0.25);
            color: #ff6b7a;
        }

        .alert-success-custom {
            background: rgba(0,212,170,0.12);
            border: 1px solid rgba(0,212,170,0.25);
            color: #00d4aa;
        }

        /* ── Divider ── */
        .divider {
            display: flex; align-items: center; gap: 1rem;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Register Link ── */
        .register-link {
            text-align: center;
            margin-top: 1.25rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .register-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .register-link a:hover { color: var(--accent-2); }

        /* ── Footer ── */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #2d3148;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="login-wrapper">
    <div class="login-card">

        <!-- Brand -->
        <div class="brand-icon">
            <i class="bi bi-building-check"></i>
        </div>
        <div class="brand-title">SIM<span>PEG</span></div>
        <div class="brand-sub">Sistem Informasi Manajemen Pegawai</div>

        <!-- Alert -->
        <div id="alertBox" style="display:none;" class="mb-3"></div>

        <!-- Form -->
        <form id="loginForm" autocomplete="off">

            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope-fill"></i>
                    </span>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="nama@simpeg.com"
                        required
                        autofocus
                    >
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="••••••••"
                        required
                    >
                    <button type="button" class="btn-toggle-pw" id="togglePw">
                        <i class="bi bi-eye-fill" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <span class="spinner" id="spinner"></span>
                <span class="btn-text">LOGIN</span>
            </button>

        </form>

        <!-- <div class="divider">atau</div> -->

        <!-- <div class="register-link">
            Belum punya akun?
            <a href="register.html">Daftar sebagai Pegawai</a>
        </div> -->

    </div>

    <div class="login-footer">
        &copy;  program ini pure di buat untuk memenuhi project uas matakuliah &mdash; Pemrograman Web 
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ── Toggle Password Visibility ──
    document.getElementById('togglePw').addEventListener('click', function () {
        const pw   = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (pw.type === 'password') {
            pw.type = 'text';
            icon.className = 'bi bi-eye-slash-fill';
        } else {
            pw.type = 'password';
            icon.className = 'bi bi-eye-fill';
        }
    });

    // ── Show Alert ──
    function showAlert(type, message) {
        const box  = document.getElementById('alertBox');
        const icon = type === 'danger' ? 'bi-exclamation-circle-fill' : 'bi-check-circle-fill';
        box.innerHTML = `
            <div class="alert-custom alert-${type}-custom">
                <i class="bi ${icon}"></i>
                ${message}
            </div>`;
        box.style.display = 'block';
    }

    function hideAlert() {
        document.getElementById('alertBox').style.display = 'none';
    }

    // ── Set Loading State ──
    function setLoading(state) {
        const btn = document.getElementById('btnLogin');
        if (state) {
            btn.classList.add('loading');
            btn.disabled = true;
            document.querySelector('.btn-text').textContent = 'Memproses...';
        } else {
            btn.classList.remove('loading');
            btn.disabled = false;
            document.querySelector('.btn-text').textContent = 'Masuk';
        }
    }

    // ── Login Form Submit ──
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        hideAlert();

        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
            showAlert('danger', 'Email dan password wajib diisi.');
            return;
        }

        setLoading(true);

        try {
            const res  = await fetch('/simpeg/api/auth/Login.php', {
                method:      'POST',
                headers:     { 'Content-Type': 'application/json' },
                credentials: 'include',
                body:        JSON.stringify({ email, password }),
            });

            const data = await res.json();

            if (data.status === 'success') {
                showAlert('success', `Selamat datang, ${data.data.user.nama}! Mengalihkan...`);

                // Simpan data user di sessionStorage
                sessionStorage.setItem('user', JSON.stringify(data.data.user));

                // Redirect berdasarkan role
                setTimeout(() => {
                    if (data.data.user.role === 'admin') {
                        window.location.href = '/simpeg/admin/dashboard.html';
                    } else {
                        window.location.href = '/simpeg/pegawai/dashboard.html';
                    }
                }, 1200);

            } else {
                showAlert('danger', data.message || 'Login gagal. Coba lagi.');
                setLoading(false);
            }

        } catch (err) {
            showAlert('danger', 'Tidak dapat terhubung ke server. Pastikan Laragon aktif.');
            setLoading(false);
        }
    });

    // ── Cek kalau sudah login sebelumnya ──
    window.addEventListener('load', function () {
        const user = sessionStorage.getItem('user');
        if (user) {
            const u = JSON.parse(user);
            if (u.role === 'admin') {
                window.location.href = '/simpeg/admin/dashboard.html';
            } else {
                window.location.href = '/simpeg/pegawai/dashboard.html';
            }
        }
    });
</script>
</body>
</html>
